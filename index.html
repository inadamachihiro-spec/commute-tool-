<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勤務エリア管理ツール</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f7f7f5;--bg3:#f0f0ec;
  --border:rgba(0,0,0,.12);--border2:rgba(0,0,0,.22);
  --text:#1a1a18;--text2:#6b6b67;--text3:#9a9a96;
  --ok-bg:#eaf3de;--ok-text:#27500a;--ok-bd:#7ab84a;
  --ng-bg:#fcebeb;--ng-text:#791f1f;--ng-bd:#e24b4a;
  --c-bg:#faeeda;--c-text:#633806;--c-bd:#ef9f27;
  --info-bg:#e6f1fb;--info-text:#0c447c;
  --r:10px;--rs:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;font-size:14px;color:var(--text);background:var(--bg2);min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:1.5rem}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
.hd h1{font-size:20px;font-weight:600}
.bdg{font-size:11px;background:var(--info-bg);color:var(--info-text);padding:3px 10px;border-radius:20px;font-weight:500}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.tab{padding:9px 20px;font-size:13px;cursor:pointer;border:.5px solid transparent;border-bottom:none;border-radius:var(--rs) var(--rs) 0 0;color:var(--text2);background:transparent;font-weight:500}
.tab:hover{color:var(--text);background:var(--bg3)}
.tab.on{background:var(--bg);border-color:var(--border);color:var(--text);margin-bottom:-1px}
.pnl{display:none}.pnl.on{display:block}
.uz{border:1.5px dashed var(--border2);border-radius:var(--r);padding:2rem;text-align:center;background:var(--bg);position:relative;margin-bottom:1rem;cursor:pointer;transition:all .15s}
.uz:hover{border-color:var(--info-text);background:var(--info-bg)}
.uz.ok{border-style:solid;border-color:var(--ok-bd);background:var(--ok-bg)}
.uz input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.uz .ico{font-size:2rem;margin-bottom:8px}
.uz p{font-size:13px;color:var(--text2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok-text);background:var(--ok-bg);border:.5px solid var(--ok-bd);padding:4px 10px;border-radius:20px;margin-bottom:12px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:12px;color:var(--text2);font-weight:500}
.fg input,.fg textarea,.fg select{font-size:13px;border:.5px solid var(--border2);border-radius:var(--rs);padding:8px 10px;background:var(--bg);color:var(--text);width:100%;font-family:inherit}
.fg textarea{min-height:90px;resize:vertical}
.sl{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.dvd{border:none;border-top:.5px solid var(--border);margin:1.25rem 0}
.sb{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rs);padding:.75rem 1rem;margin:.75rem 0}
.sr{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
.spin{width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--info-text);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.pw{height:3px;border-radius:3px;background:var(--bg3);overflow:hidden;margin-top:8px}
.pi{height:100%;border-radius:3px;background:var(--info-text);width:0;transition:width .4s}
.ab{border:.5px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;background:var(--bg);margin:1rem 0}
.abh{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);font-weight:600;margin-bottom:12px}
.as{margin-bottom:14px}
.tgs{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.tg{font-size:12px;padding:4px 10px;border-radius:20px;border:.5px solid;cursor:pointer;transition:opacity .15s;user-select:none}
.tg:hover{opacity:.65}
.tg::after{content:" ×";opacity:.45}
.tv::after{content:'';cursor:default}
.tok{background:var(--ok-bg);color:var(--ok-text);border-color:var(--ok-bd)}
.tng{background:var(--ng-bg);color:var(--ng-text);border-color:var(--ng-bd)}
.tc{background:var(--c-bg);color:var(--c-text);border-color:var(--c-bd)}
.ma{display:flex;gap:8px;margin-top:8px}
.ma input{flex:1;font-size:13px;border:.5px solid var(--border2);border-radius:var(--rs);padding:6px 10px;background:var(--bg2);color:var(--text);font-family:inherit}
.btn{padding:8px 18px;border-radius:var(--rs);font-size:13px;cursor:pointer;border:.5px solid var(--border2);background:var(--bg);color:var(--text);font-weight:500;transition:all .15s;font-family:inherit}
.btn:hover{background:var(--bg3)}
.btnp{background:var(--text);color:var(--bg);border-color:var(--text)}
.btnp:hover{opacity:.82;background:var(--text)}
.btns{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btnd{color:var(--ng-text);border-color:var(--ng-bd)}
.btnd:hover{background:var(--ng-bg)}
.ar{display:flex;justify-content:flex-end;gap:8px;margin-top:1rem}
.cc{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;margin-bottom:10px}
.cch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ccn{font-weight:600;font-size:14px}
.ccm{font-size:12px;color:var(--text3)}
.rc{border-radius:var(--r);padding:1rem 1.25rem;border:.5px solid;margin-bottom:8px}
.rok{background:var(--ok-bg);border-color:var(--ok-bd)}
.rng{background:var(--ng-bg);border-color:var(--ng-bd)}
.rc_{background:var(--c-bg);border-color:var(--c-bd)}
.rh{display:flex;align-items:center;justify-content:space-between}
.rn{font-weight:600;font-size:14px}
.rb{font-size:12px;font-weight:600;padding:4px 14px;border-radius:20px;color:#fff}
.bok{background:#3b6d11}.bng{background:#a32d2d}.bc{background:#854f0b}
.rr{font-size:12px;margin-top:5px;opacity:.8}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem}
.st{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rs);padding:.75rem 1rem;text-align:center}
.sn{font-size:22px;font-weight:600}
.sl2{font-size:11px;color:var(--text3);margin-top:2px}
.empty{text-align:center;padding:2.5rem;color:var(--text3);font-size:13px;line-height:1.8}
.err{background:var(--ng-bg);border:.5px solid var(--ng-bd);color:var(--ng-text);border-radius:var(--rs);padding:.75rem 1rem;font-size:13px;margin:.75rem 0}
@media(max-width:600px){.fr{grid-template-columns:1fr}.sg{grid-template-columns:repeat(2,1fr)}.wrap{padding:1rem}}
</style>
</head>
<body>
<div class="wrap">
<div class="hd"><span style="font-size:24px">📍</span><h1>勤務エリア管理ツール</h1><span class="bdg">Gemini AI 自動解析</span></div>

<div class="tabs">
  <button class="tab on" onclick="sw('reg')">📋 企業登録</button>
  <button class="tab" onclick="sw('list')">🏢 企業一覧</button>
  <button class="tab" onclick="sw('judge')">👤 通勤可否判定</button>
</div>

<!-- 企業登録 -->
<div id="pnl-reg" class="pnl on">
  <p class="sl">採用条件ファイルのアップロード</p>
  <div class="uz" id="regZone" onclick="document.getElementById('regFile').click()">
    <input type="file" id="regFile" accept=".pdf,.xlsx,.xls,.csv,.txt" style="display:none" onchange="onRegFile(event)">
    <div class="ico">📂</div>
    <p><strong>PDF・Excel・CSV・テキストをドロップまたはクリック</strong></p>
    <p style="margin-top:4px;font-size:12px">アップロード後、AIで解析ボタンを押してください</p>
  </div>
  <div id="regChip" style="display:none"><span class="chip">✅ <span id="regFN"></span></span></div>
  <div class="fr">
    <div class="fg"><label>企業名</label><input type="text" id="cname" placeholder="例：株式会社〇〇"></div>
    <div class="fg"><label>更新日</label><input type="date" id="cdate"></div>
  </div>
  <div class="fg" style="margin-bottom:12px">
    <label>または採用条件テキストを直接貼り付け</label>
    <textarea id="rawText" placeholder="メール・資料のテキストをそのまま貼り付けてもOKです"></textarea>
  </div>
  <div id="regSt" style="display:none"><div class="sb"><div class="sr"><span class="spin"></span><span id="regStTxt">AIが解析中...</span></div><div class="pw"><div class="pi" id="regPi"></div></div></div></div>
  <div id="regErr" class="err" style="display:none"></div>
  <div id="aiRes" style="display:none">
    <div class="ab">
      <div class="abh">✨ AI解析結果（タグをクリックで削除・手動追加も可）</div>
      <div class="as"><p class="sl" style="margin-bottom:6px">通勤OK</p><div class="tgs" id="okTags"></div><div class="ma"><input type="text" id="addOk" placeholder="路線・エリア名を追加" onkeydown="if(event.key==='Enter')addT('ok')"><button class="btn btns" onclick="addT('ok')">＋</button></div></div>
      <div class="as"><p class="sl" style="margin-bottom:6px">通勤NG</p><div class="tgs" id="ngTags"></div><div class="ma"><input type="text" id="addNg" placeholder="路線・エリア名を追加" onkeydown="if(event.key==='Enter')addT('ng')"><button class="btn btns" onclick="addT('ng')">＋</button></div></div>
      <div class="as"><p class="sl" style="margin-bottom:6px">要相談</p><div class="tgs" id="cTags"></div><div class="ma"><input type="text" id="addC" placeholder="路線・エリア名を追加" onkeydown="if(event.key==='Enter')addT('c')"><button class="btn btns" onclick="addT('c')">＋</button></div></div>
    </div>
  </div>
  <div class="ar">
    <button class="btn" onclick="clearReg()">クリア</button>
    <button class="btn btnp" id="anaBtn" onclick="analyze()">✨ AIで解析</button>
    <button class="btn btnp" id="saveBtn" onclick="saveC()" style="display:none">✅ 登録する</button>
  </div>
</div>

<!-- 企業一覧 -->
<div id="pnl-list" class="pnl">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
    <p class="sl" style="margin-bottom:0">登録企業一覧</p>
    <input type="text" placeholder="企業名・路線で検索..." style="width:200px;font-size:12px;border:.5px solid var(--border2);border-radius:var(--rs);padding:6px 10px;background:var(--bg);color:var(--text);font-family:inherit" oninput="renderList(this.value)">
  </div>
  <div id="statG" style="display:none" class="sg">
    <div class="st"><div class="sn" id="stTotal">0</div><div class="sl2">登録企業数</div></div>
    <div class="st"><div class="sn" id="stOk" style="color:var(--ok-text)">0</div><div class="sl2">OK路線数</div></div>
    <div class="st"><div class="sn" id="stDate">-</div><div class="sl2">最終更新</div></div>
  </div>
  <div id="coList"><div class="empty">🏢<br>まだ登録されていません</div></div>
</div>

<!-- 通勤可否判定 -->
<div id="pnl-judge" class="pnl">
  <p class="sl">履歴書アップロード</p>
  <div class="uz" id="resZone" onclick="document.getElementById('resFile').click()">
    <input type="file" id="resFile" accept=".pdf,.txt" style="display:none" onchange="onResFile(event)">
    <div class="ico">📄</div>
    <p><strong>履歴書をドロップまたはクリック</strong>（PDF・テキスト）</p>
    <p style="margin-top:4px;font-size:12px">AIが住所・最寄り駅を自動抽出します</p>
  </div>
  <div id="resChip" style="display:none"><span class="chip">✅ <span id="resFN"></span></span></div>
  <div id="resSt" style="display:none"><div class="sb"><div class="sr"><span class="spin"></span><span id="resStTxt">履歴書を解析中...</span></div><div class="pw"><div class="pi" id="resPi"></div></div></div></div>
  <div class="fr" style="margin-top:12px">
    <div class="fg"><label>応募者名</label><input type="text" id="aname" placeholder="例：山田 太郎"></div>
    <div class="fg"><label>居住地・最寄り駅</label><input type="text" id="aaddr" placeholder="例：名古屋市千種区 / 千種駅（東山線）"></div>
  </div>
  <div id="judSt" style="display:none"><div class="sb"><div class="sr"><span class="spin"></span><span id="judStTxt">判定中...</span></div><div class="pw"><div class="pi" id="judPi"></div></div></div></div>
  <div id="judErr" class="err" style="display:none"></div>
  <div class="ar" style="margin-bottom:1rem">
    <button class="btn btnp" id="judBtn" onclick="judge()">🔍 全社まとめて判定</button>
  </div>
  <div id="judRes" style="display:none"><hr class="dvd"><p class="sl">判定結果</p><div id="judList"></div></div>
</div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const WORKER='https://throbbing-bar-2a0f.inadama-chihiro.workers.dev';
const STATIONS={
  "東海道本線（名古屋〜豊橋）":["尾頭橋","金山","熱田","笠寺","大高","南大高","共和","大府","刈谷","野田新町","東刈谷","三河安城","安城","岡崎","幸田","蒲郡","豊橋"],
  "東海道本線（名古屋〜岐阜）":["名古屋","枇杷島","清州","稲沢","尾張一宮","木曽川","岐阜"],
  "中央本線":["金山","鶴舞","千種","大曽根","新守山","勝川","春日井","神領","高蔵寺","多治見","土岐市","瑞浪","恵那","中津川"],
  "関西本線":["八田","春田","蟹江","永和","弥富","長島","桑名","富田","四日市","亀山"],
  "高山本線":["長森","那加","蘇原","各務ヶ原","鵜沼","美濃太田","下呂","髙山","猪谷"],
  "飯田線":["豊川","新城","本長篠","三河大野","湯谷温泉","中部天竜","佐久間","水窪"],
  "東山線":["藤が丘","本郷","上社","一社","星ヶ丘","東山公園","本山","覚王山","池下","今池","千種","新栄町","栄","伏見","名古屋","亀島","本陣","中村日赤","中村公園","岩塚","八田"],
  "桜通線":["徳重","神沢","相生山","鳴子北","野並","鶴里","新瑞橋","瑞穂区役所","桜山","御器所","吹上","今池","久屋大通","丸の内","国際センター","名古屋","中村区役所"],
  "名城線":["名古屋大学","八事日赤","八事","新瑞橋","堀田","神宮西","金山","東別院","上前津","矢場町","栄","久屋大通","市役所","名城公園","黒川","平安通","大曽根","砂田橋","茶屋ヶ坂","本山"],
  "鶴舞線":["赤池","平針","原","植田","塩釜口","八事","いりなか","川名","御器所","荒畑","鶴舞","上前津","大須観音","伏見","丸の内","浅間町","浄心","庄内通","庄内緑地公園","上小田井"],
  "名鉄名古屋本線":["名鉄名古屋","山王","金山","神宮前","堀田","呼続","桜","本笠寺","鳴海","有松","前後","豊明","富士松","一ツ木","知立","矢作橋","岡崎公園前","東岡崎","豊橋"],
  "名鉄常滑線":["名鉄名古屋","山王","金山","神宮前","道徳","大江","大同町","柴田","名和","太田川","尾張横須賀","寺本","朝倉","古見","長浦","日長","新舞子","大野町","常滑","中部国際空港"],
  "名鉄三河線":["猿投","平戸橋","越戸","梅坪","豊田市","上挙母","土橋","竹村","若林","三河知立","知立","刈谷","刈谷市","吉浜","三河高浜","高浜港","北新川","新川町","碧南"],
  "近鉄名古屋線":["近鉄名古屋","米野","黄金","烏森","近鉄八田","伏屋","戸田","近鉄蟹江","富吉","近鉄弥富","近鉄長島","桑名","益生","川越富洲原","近鉄富田","近鉄四日市","白子"],
  "愛知環状鉄道":["中水野","瀬戸市","瀬戸口","八草","保見","貝津","四郷","新豊田","三河豊田","永覚","三河上郷","北野桝塚","大門","北岡崎","中岡崎","岡崎公園前"],
};

let cos=JSON.parse(localStorage.getItem('wc_cos')||'[]');
let cur={ok:[],ng:[],consult:[]};
let regTxt='';

window.onload=()=>{ document.getElementById('cdate').value=new Date().toISOString().split('T')[0]; };

function sw(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.pnl').forEach(x=>x.classList.remove('on'));
  document.querySelector(`[onclick="sw('${t}')"]`).classList.add('on');
  document.getElementById('pnl-'+t).classList.add('on');
  if(t==='list') renderList();
}

function pg(id,pct,dur=600){
  const el=document.getElementById(id);
  if(!el)return;
  const s=parseFloat(el.style.width)||0,d=pct-s,t0=Date.now();
  (function f(){const p=Math.min(1,(Date.now()-t0)/dur);el.style.width=(s+d*p)+'%';if(p<1)requestAnimationFrame(f);})();
}

async function pdfText(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let t='';
  for(let i=1;i<=Math.min(pdf.numPages,15);i++){
    const pg=await pdf.getPage(i);
    const c=await pg.getTextContent();
    t+=c.items.map(s=>s.str).join(' ')+'\n';
  }
  return t;
}

async function xlsxText(file){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  let t='';
  wb.SheetNames.forEach(n=>{
    const rows=XLSX.utils.sheet_to_csv(wb.Sheets[n]).split('\n').filter(r=>r.replace(/,/g,'').trim()).slice(0,150);
    t+=`【${n}】\n${rows.join('\n')}\n\n`;
  });
  return t.substring(0,5000);
}

async function readFile(file){
  if(file.name.match(/\.pdf$/i)) return await pdfText(file);
  if(file.name.match(/\.xlsx?$/i)) return await xlsxText(file);
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result||'');
    r.onerror=()=>res('');
    r.readAsText(file,'UTF-8');
  });
}

async function onRegFile(e){
  const file=e.target.files[0];
  if(!file)return;
  document.getElementById('regZone').classList.add('ok');
  document.getElementById('regChip').style.display='block';
  document.getElementById('regFN').textContent=file.name;
  if(!document.getElementById('cname').value)
    document.getElementById('cname').value=file.name.replace(/\.[^.]+$/,'').replace(/[_\-]/g,' ');
  regTxt=await readFile(file);
  if(regTxt) document.getElementById('rawText').value=regTxt.substring(0,4000);
}

async function onResFile(e){
  const file=e.target.files[0];
  if(!file)return;
  document.getElementById('resZone').classList.add('ok');
  document.getElementById('resChip').style.display='block';
  document.getElementById('resFN').textContent=file.name;
  const txt=await readFile(file);
  document.getElementById('resSt').style.display='block';
  pg('resPi',40,400);
  const sl=Object.entries(STATIONS).map(([l,ss])=>`${l}: ${ss.join('、')}`).join('\n');
  const prompt=`以下の履歴書から氏名・住所・最寄り駅を抽出してください。\n\n【駅マスタ】\n${sl}\n\n【履歴書】\n${txt.substring(0,3000)}\n\nJSON形式のみで返してください：\n{"name":"氏名","address":"住所","station":"最寄り駅と路線名"}`;
  try{
    pg('resPi',75,600);
    const res=await callAI(prompt,400);
    pg('resPi',100,200);
    if(res.name) document.getElementById('aname').value=res.name;
    const parts=[res.address,res.station].filter(Boolean);
    if(parts.length) document.getElementById('aaddr').value=parts.join(' / ');
  }catch(err){
    document.getElementById('resStTxt').textContent='自動抽出失敗。手動で入力してください。';
  }
  setTimeout(()=>document.getElementById('resSt').style.display='none',1200);
}

async function callAI(prompt,maxTokens=2048){
  const resp=await fetch(WORKER,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({prompt,maxTokens})
  });
  if(!resp.ok){
    const err=await resp.json().catch(()=>({}));
    throw new Error(err.error||`エラー(${resp.status})`);
  }
  const data=await resp.json();
  if(data.error) throw new Error(data.error);
  const raw=data.text||'';
  const clean=raw.replace(/```json|```/g,'').trim();
  const m=clean.match(/(\{[\s\S]*\}|\[[\s\S]*\])/);
  if(!m) throw new Error('解析エラー: '+clean.substring(0,80));
  return JSON.parse(m[1]);
}

async function analyze(){
  const text=document.getElementById('rawText').value.trim()||regTxt;
  if(!text){alert('採用条件テキストを入力またはファイルをアップロードしてください');return;}
  document.getElementById('anaBtn').disabled=true;
  document.getElementById('regSt').style.display='block';
  document.getElementById('regErr').style.display='none';
  document.getElementById('regStTxt').textContent='AIがエリア情報を抽出中...';
  pg('regPi',20,400);
  const sl=Object.entries(STATIONS).map(([l,ss])=>`${l}: ${ss.join('、')}`).join('\n');
  const prompt=`以下の採用条件テキストを解析し、勤務エリアをOK/NG/要相談に分類してください。\n\n【駅・路線マスタ】\n${sl}\n\n【採用条件テキスト】\n${text.substring(0,4000)}\n\nJSON形式のみで返してください（前置き不要）：\n{"ok":["路線名またはエリア名"],"ng":["路線名またはエリア名"],"consult":["路線名またはエリア名"]}`;
  try{
    pg('regPi',55,800);
    const res=await callAI(prompt,2048);
    pg('regPi',100,200);
    cur={ok:res.ok||[],ng:res.ng||[],consult:res.consult||[]};
    renderTags();
    document.getElementById('aiRes').style.display='block';
    document.getElementById('saveBtn').style.display='inline-flex';
  }catch(err){
    document.getElementById('regErr').textContent='❌ '+err.message;
    document.getElementById('regErr').style.display='block';
  }
  setTimeout(()=>document.getElementById('regSt').style.display='none',600);
  document.getElementById('anaBtn').disabled=false;
}

function renderTags(){
  rg('okTags',cur.ok,'tok','ok');
  rg('ngTags',cur.ng,'tng','ng');
  rg('cTags',cur.consult,'tc','c');
}
function rg(id,items,cls,type){
  const k=type==='c'?'consult':type;
  document.getElementById(id).innerHTML=items.map((t,i)=>`<span class="tg ${cls}" onclick="delT('${k}',${i})">${t}</span>`).join('');
}
function delT(k,i){cur[k].splice(i,1);renderTags();}
function addT(type){
  const k=type==='c'?'consult':type;
  const inp={ok:'addOk',ng:'addNg',c:'addC'}[type];
  const v=document.getElementById(inp).value.trim();
  if(!v)return;
  cur[k].push(v);
  document.getElementById(inp).value='';
  renderTags();
  document.getElementById('aiRes').style.display='block';
}

function saveC(){
  const name=document.getElementById('cname').value.trim();
  if(!name){alert('企業名を入力してください');return;}
  const c={id:Date.now(),name,updatedAt:document.getElementById('cdate').value||new Date().toISOString().split('T')[0],areas:JSON.parse(JSON.stringify(cur))};
  const i=cos.findIndex(x=>x.name===name);
  if(i>=0)cos[i]=c;else cos.push(c);
  localStorage.setItem('wc_cos',JSON.stringify(cos));
  clearReg();
  sw('list');
}

function clearReg(){
  document.getElementById('cname').value='';
  document.getElementById('rawText').value='';
  document.getElementById('aiRes').style.display='none';
  document.getElementById('saveBtn').style.display='none';
  document.getElementById('regZone').classList.remove('ok');
  document.getElementById('regChip').style.display='none';
  document.getElementById('regFile').value='';
  document.getElementById('regErr').style.display='none';
  cur={ok:[],ng:[],consult:[]};
  regTxt='';
}

function renderList(f=''){
  const filtered=cos.filter(c=>!f||c.name.includes(f)||(c.areas.ok||[]).some(a=>a.includes(f)));
  document.getElementById('statG').style.display=cos.length?'grid':'none';
  if(cos.length){
    document.getElementById('stTotal').textContent=cos.length;
    document.getElementById('stOk').textContent=cos.reduce((s,c)=>s+(c.areas.ok||[]).length,0);
    document.getElementById('stDate').textContent=cos.slice().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt))[0]?.updatedAt||'-';
  }
  const el=document.getElementById('coList');
  if(!filtered.length){el.innerHTML=`<div class="empty">🏢<br>${cos.length?'該当なし':'まだ登録されていません'}</div>`;return;}
  el.innerHTML=filtered.map(c=>`
    <div class="cc">
      <div class="cch"><span class="ccn">🏢 ${c.name}</span><span class="ccm">更新：${c.updatedAt}</span></div>
      ${(c.areas.ok||[]).length?`<div class="as"><p class="sl" style="margin-bottom:5px">通勤OK</p><div class="tgs">${c.areas.ok.map(t=>`<span class="tg tok tv">${t}</span>`).join('')}</div></div>`:''}
      ${(c.areas.ng||[]).length?`<div class="as"><p class="sl" style="margin-bottom:5px">通勤NG</p><div class="tgs">${c.areas.ng.map(t=>`<span class="tg tng tv">${t}</span>`).join('')}</div></div>`:''}
      ${(c.areas.consult||[]).length?`<div class="as"><p class="sl" style="margin-bottom:5px">要相談</p><div class="tgs">${c.areas.consult.map(t=>`<span class="tg tc tv">${t}</span>`).join('')}</div></div>`:''}
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
        <button class="btn btns" onclick="editC(${c.id})">✏️ 編集</button>
        <button class="btn btns btnd" onclick="delC(${c.id})">🗑 削除</button>
      </div>
    </div>`).join('');
}
function editC(id){
  const c=cos.find(x=>x.id===id);
  if(!c)return;
  sw('reg');
  document.getElementById('cname').value=c.name;
  document.getElementById('cdate').value=c.updatedAt;
  cur=JSON.parse(JSON.stringify(c.areas));
  renderTags();
  document.getElementById('aiRes').style.display='block';
  document.getElementById('saveBtn').style.display='inline-flex';
}
function delC(id){
  if(!confirm('削除しますか？'))return;
  cos=cos.filter(x=>x.id!==id);
  localStorage.setItem('wc_cos',JSON.stringify(cos));
  renderList();
}

async function judge(){
  const addr=document.getElementById('aaddr').value.trim();
  const name=document.getElementById('aname').value.trim()||'応募者';
  if(!addr){alert('居住地または最寄り駅を入力してください');return;}
  if(!cos.length){alert('先に企業を登録してください');return;}
  document.getElementById('judBtn').disabled=true;
  document.getElementById('judSt').style.display='block';
  document.getElementById('judErr').style.display='none';
  document.getElementById('judStTxt').textContent='AIが通勤可否を判定中...';
  pg('judPi',20,400);
  const sl=Object.entries(STATIONS).map(([l,ss])=>`${l}: ${ss.join('、')}`).join('\n');
  const cd=cos.map(c=>`【${c.name}】\nOK: ${(c.areas.ok||[]).join('、')||'なし'}\nNG: ${(c.areas.ng||[]).join('、')||'なし'}\n要相談: ${(c.areas.consult||[]).join('、')||'なし'}`).join('\n\n');
  const prompt=`応募者「${name}」の居住地「${addr}」について各企業への通勤可否を判定してください。\n\n【路線・駅マスタ】\n${sl}\n\n【各社エリア条件】\n${cd}\n\nJSON配列のみで返してください：\n[{"company":"企業名","status":"ok","reason":"判定理由30文字以内"}]\nstatusは"ok","ng","consult"のいずれか。`;
  try{
    pg('judPi',55,800);
    const res=await callAI(prompt,2048);
    pg('judPi',100,200);
    document.getElementById('judList').innerHTML=res.map(r=>{
      const s=r.status==='consult'?'_':r.status;
      return `<div class="rc r${s}"><div class="rh"><span class="rn">${r.company}</span><span class="rb b${s==='_'?'c':s}">${r.status==='ok'?'✓ 通勤OK':r.status==='ng'?'✗ 通勤NG':'△ 要相談'}</span></div><p class="rr">${r.reason}</p></div>`;
    }).join('');
    document.getElementById('judRes').style.display='block';
  }catch(err){
    document.getElementById('judErr').textContent='❌ '+err.message;
    document.getElementById('judErr').style.display='block';
  }
  setTimeout(()=>document.getElementById('judSt').style.display='none',600);
  document.getElementById('judBtn').disabled=false;
}
</script>
